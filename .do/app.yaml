name: realitycheck-ai
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: REALITYCHECK_ENV
        value: production
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: LOCAL_MODEL_ID
        value: gemma4:e4b
      - key: SQLITE_DB_PATH
        value: realitycheck.db
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 15
